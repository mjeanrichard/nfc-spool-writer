name: Check

# The same verification pass as `scripts/check.sh` locally: debug build, unit tests, lint. It runs on
# every push and pull request, and the release workflow calls it as well, so no bundle is ever built
# from a tree whose tests are red.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

# A pull request that gets several pushes only needs its newest run. Pushes to master and the runs
# triggered by the release workflow are never cancelled.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    # Actions are pinned to a commit SHA rather than a tag. A tag is mutable: whoever controls the
    # action repository can repoint `v7` at different code, and every workflow referencing it runs
    # that code on the next build without anything changing here. The trailing `# vX.Y.Z` comment is
    # not decoration - it is how Dependabot knows which version a SHA stands for, and what it
    # rewrites when a new one lands.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, test and lint
        run: ./scripts/check.sh

      # Uploaded even when the run fails - that is the case where they are actually needed, since the
      # console output names the failing tests but not what they asserted.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports
          path: |
            src/app/build/reports/tests/testDebugUnitTest/
            src/app/build/test-results/testDebugUnitTest/
            src/app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
