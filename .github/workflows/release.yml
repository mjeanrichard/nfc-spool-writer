name: Release

# Produces the signed artifacts: the App Bundle for a Play upload, and an APK for sideloading.
# Manual by default: a release is a deliberate act, and every upload burns a versionCode. Pushing a
# `v*` tag builds too, and additionally publishes a GitHub release with both artifacts attached.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName override (e.g. 1.0.1). Blank keeps build.gradle.kts.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag is not a promise that the tree was ever green, so the full local verification pass runs
  # first and the build only starts if it passes.
  check:
    uses: ./.github/workflows/check.yml

  bundle:
    needs: check
    runs-on: ubuntu-latest

    # The upload key lives in this environment's secrets, not the repository's, so only a ref the
    # environment allows can read it: `master` and `v*` tags. That closes the hole that
    # workflow_dispatch would otherwise leave open - dispatch takes a ref, and the workflow file from
    # that ref is what runs, so a branch carrying an edited copy of this file could otherwise decode
    # the keystore without a review. The environment also gates each run on a manual approval.
    environment: release

    # Needed to create the GitHub release; the reusable check workflow keeps the read-only default.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # versionCode must be unique per upload or Play rejects the bundle. The run number is
      # monotonic per workflow and never reused, so it cannot collide with an earlier upload.
      # Offset keeps room for the versionCode = 1 already reserved for the first manual build.
      #
      # versionName comes from the tag when there is one, so `v1.0.1` and the version the user sees
      # in the app cannot drift apart. The input is read from the environment rather than
      # interpolated into the script, which would let a crafted input inject shell.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$INPUT_VERSION_NAME"
          fi
          {
            echo "code=$(( ${{ github.run_number }} + 1 ))"
            echo "name=$name"
            # Blank versionName means build.gradle.kts decides, which this job cannot see - so the
            # run number stands in for naming the artifacts.
            echo "label=${name:-run${{ github.run_number }}}"
          } >> "$GITHUB_OUTPUT"

      # The secret holds the .jks base64-encoded because GitHub secrets are text-only. It is
      # written outside the workspace so it can never be picked up by a build glob or an artifact.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See STORE_PLAN.md Phase 1."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"

      - name: Build signed bundle and APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/signing/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_versionCodeOverride: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_versionNameOverride: ${{ steps.version.outputs.name }}
        run: ./scripts/release.sh

      # Gathering both artifacts under their published names once means the verification steps, the
      # workflow artifact and the GitHub release all work from the same two files.
      - name: Stage release assets
        id: assets
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          assets="$RUNNER_TEMP/release-assets"
          rm -rf "$assets" && mkdir -p "$assets"

          for pair in bundle:aab apk:apk; do
            output_dir="src/app/build/outputs/${pair%:*}/release"
            extension="${pair#*:}"
            built=$(find "$output_dir" -name "*.$extension" -print -quit)
            if [ -z "$built" ]; then
              echo "::error::No .$extension was produced in $output_dir."
              exit 1
            fi
            cp "$built" "$assets/nfc-spool-writer-$LABEL.$extension"
          done

          {
            echo "dir=$assets"
            echo "aab=$assets/nfc-spool-writer-$LABEL.aab"
            echo "apk=$assets/nfc-spool-writer-$LABEL.apk"
          } >> "$GITHUB_OUTPUT"
          ls -l "$assets"

      # Gradle leaves the artifacts unsigned when credentials are missing rather than failing, so that
      # a machine without the key can still run lintRelease. That trade-off has to be paid for here:
      # without this check a misconfigured secret would produce artifacts that only fail much later,
      # at upload time - or worse, an APK that installs for nobody.
      #
      # The two artifacts need different tools. The bundle carries a JAR signature, but the APK does
      # not: minSdk is 29, so AGP signs it with APK Signature Scheme v2 and META-INF holds no
      # certificate at all - inspecting the zip entries would report every APK as unsigned.
      - name: Verify the artifacts are signed
        env:
          AAB: ${{ steps.assets.outputs.aab }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          # jarsigner exits 0 even for an unsigned jar unless -strict is passed, and -strict would
          # fail on the self-signed upload certificate, so the verdict has to come from the output.
          if ! jarsigner -verify "$AAB" | grep -q '^jar verified\.'; then
            echo "::error::$(basename "$AAB") is NOT signed - check the ANDROID_* secrets."
            exit 1
          fi
          echo "Signed: $(basename "$AAB")"

          apksigner=$(find "${ANDROID_HOME:?}/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          "$apksigner" verify --print-certs "$APK"
          echo "Signed: $(basename "$APK")"

      # Every .so must start on a 16 KB boundary or the app breaks on 16 KB-page devices, which Play
      # requires support for. The AAB does contain native code (AndroidX ships
      # libandroidx.graphics.path.so and libdatastore_shared_counter.so), so this is a real check
      # rather than a formality.
      - name: Verify 16 KB page alignment
        env:
          AAB: ${{ steps.assets.outputs.aab }}
        run: |
          work="$RUNNER_TEMP/aab"
          rm -rf "$work" && mkdir -p "$work"
          unzip -q "$AAB" -d "$work"

          mapfile -t libs < <(find "$work" -name '*.so')
          if [ ${#libs[@]} -eq 0 ]; then
            echo "No native libraries - 16 KB alignment is not applicable."
            exit 0
          fi

          status=0
          for lib in "${libs[@]}"; do
            # p_align of each LOAD segment must be >= 16384 (0x4000).
            aligns=$(readelf -lW "$lib" | awk '$1 == "LOAD" { print $NF }')
            for align in $aligns; do
              if [ "$((align))" -lt 16384 ]; then
                echo "::error::$(basename "$lib") has LOAD alignment $align (< 16384)"
                status=1
              fi
            done
            echo "ok: $(basename "$lib") [$aligns]"
          done
          exit $status

      # Confirms the BuildConfig.DEBUG gate took effect. Minification is off, so the harness classes
      # are still present in the DEX - what must be false is the flag that makes them reachable.
      - name: Verify the debug tag harness is gated off
        run: |
          config=$(find src/app/build -path '*release*' -name 'BuildConfig.java' -print -quit)
          if [ -n "$config" ] && grep -q 'DEBUG = true' "$config"; then
            echo "::error::Release BuildConfig has DEBUG = true."
            exit 1
          fi
          echo "Release BuildConfig.DEBUG is false; harness route is not registered."

      - name: Upload bundle and APK
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.label }}
          path: ${{ steps.assets.outputs.dir }}/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload mapping and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.version.outputs.code }}
          path: |
            src/app/build/reports/lint-results-release.*
            src/app/build/outputs/mapping/release/
          retention-days: 30
          if-no-files-found: ignore

      # Tag pushes only: a manual run is for checking that a build still works, not for publishing.
      # `--clobber` on the update path makes re-running a failed tag build idempotent.
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ steps.assets.outputs.dir }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          notes=$(cat <<EOF
          Install the \`.apk\` directly on the phone; the \`.aab\` is the Play upload artifact and
          cannot be installed by hand.

          The APK is signed with the **upload key**, not the Play app-signing key, so a sideloaded
          install cannot later be upgraded in place by the Play version - uninstall first if you
          switch. versionCode \`$VERSION_CODE\`.
          EOF
          )

          # A pre-release tag carries a suffix: v1.0.0-rc1, v1.1-beta2.
          extra=()
          case "$GITHUB_REF_NAME" in *-*) extra=(--prerelease);; esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSETS"/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes" \
              --generate-notes \
              "${extra[@]}" \
              "$ASSETS"/*
          fi
