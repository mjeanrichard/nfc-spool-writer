name: Release bundle

# Produces the signed Android App Bundle for a Play upload. Manual by default: a release is a
# deliberate act, and every upload burns a versionCode. Tag pushes build too, so `v1.0` produces a
# matching artifact without a second click.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName override (e.g. 1.0.1). Blank keeps build.gradle.kts.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # versionCode must be unique per upload or Play rejects the bundle. The run number is
      # monotonic per workflow and never reused, so it cannot collide with an earlier upload.
      # Offset keeps room for the versionCode = 1 already reserved for the first manual build.
      - name: Compute versionCode
        id: version
        run: echo "code=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_OUTPUT"

      # The secret holds the .jks base64-encoded because GitHub secrets are text-only. It is
      # written outside the workspace so it can never be picked up by a build glob or an artifact.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See STORE_PLAN.md Phase 1."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"

      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/signing/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_versionCodeOverride: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_versionNameOverride: ${{ inputs.version_name }}
        run: ./scripts/release.sh

      # Gradle leaves an unsigned bundle when credentials are missing rather than failing, so that a
      # machine without the key can still run lintRelease. That trade-off has to be paid for here:
      # without this check a misconfigured secret would produce an artifact that only fails much
      # later, at upload time.
      - name: Verify the bundle is signed
        run: |
          bundle=$(find src/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          if [ -z "$bundle" ]; then
            echo "::error::No .aab was produced."
            exit 1
          fi
          if ! unzip -l "$bundle" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)$'; then
            echo "::error::$bundle is NOT signed - check the ANDROID_* secrets."
            unzip -l "$bundle" | grep META-INF || true
            exit 1
          fi
          echo "Signed: $bundle"

      # Every .so must start on a 16 KB boundary or the app breaks on 16 KB-page devices, which Play
      # requires support for. The AAB does contain native code (AndroidX ships
      # libandroidx.graphics.path.so and libdatastore_shared_counter.so), so this is a real check
      # rather than a formality.
      - name: Verify 16 KB page alignment
        run: |
          bundle=$(find src/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          work="$RUNNER_TEMP/aab"
          rm -rf "$work" && mkdir -p "$work"
          unzip -q "$bundle" -d "$work"

          mapfile -t libs < <(find "$work" -name '*.so')
          if [ ${#libs[@]} -eq 0 ]; then
            echo "No native libraries - 16 KB alignment is not applicable."
            exit 0
          fi

          status=0
          for lib in "${libs[@]}"; do
            # p_align of each LOAD segment must be >= 16384 (0x4000).
            aligns=$(readelf -lW "$lib" | awk '$1 == "LOAD" { print $NF }')
            for align in $aligns; do
              if [ "$((align))" -lt 16384 ]; then
                echo "::error::$(basename "$lib") has LOAD alignment $align (< 16384)"
                status=1
              fi
            done
            echo "ok: $(basename "$lib") [$aligns]"
          done
          exit $status

      # Confirms the BuildConfig.DEBUG gate took effect. Minification is off, so the harness classes
      # are still present in the DEX - what must be false is the flag that makes them reachable.
      - name: Verify the debug tag harness is gated off
        run: |
          config=$(find src/app/build -path '*release*' -name 'BuildConfig.java' -print -quit)
          if [ -n "$config" ] && grep -q 'DEBUG = true' "$config"; then
            echo "::error::Release BuildConfig has DEBUG = true."
            exit 1
          fi
          echo "Release BuildConfig.DEBUG is false; harness route is not registered."

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ steps.version.outputs.code }}
          path: src/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload mapping and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.version.outputs.code }}
          path: |
            src/app/build/reports/lint-results-release.*
            src/app/build/outputs/mapping/release/
          retention-days: 30
          if-no-files-found: ignore
